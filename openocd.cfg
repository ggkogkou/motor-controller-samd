# OpenOCD configuration for SAMD21J18A with Atmel-ICE
# Usage: openocd -f openocd.cfg

# Interface configuration for Atmel-ICE
source [find interface/cmsis-dap.cfg]

# Alternative interface configuration if cmsis-dap doesn't work
# Uncomment the line below and comment the cmsis-dap line above
# source [find interface/atmel-ice.cfg]

# Transport selection
transport select swd

# Target configuration for SAMD21
# Use the built-in SAMD configuration
source [find target/atsamd21.cfg]

# SWD frequency - start slow, can be increased later
adapter speed 500

# Enable semihosting (optional, for debugging)
# arm semihosting enable

# Custom reset handler for SAMD21
proc samd21_reset {} {
    # Hold the target in reset
    reset halt
    
    # Wait a bit
    sleep 100
    
    # Disable watchdog if enabled
    # This prevents the MCU from resetting during programming
    mww 0x40001000 0x00000000
    
    echo "SAMD21 reset and prepared for programming"
}

# Auto-connect and halt on startup
init
echo "OpenOCD initialized for SAMD21J18A with Atmel-ICE"
echo "Use 'program <filename>' to flash firmware"
echo "Use 'reset run' to start execution"
